<style>
:root{
  --navy:#0B1120; --navy-2:#131C31;
  --gold:#D9B24C; --gold-ink:#8A6A12; --gold-wash:rgba(217,178,76,.14);
  --bg:#EEF1F7; --paper:#FFFFFF; --paper-2:#F6F8FC;
  --text:#101828; --text-2:#525C70; --text-3:#8890A2;
  --line:rgba(16,24,40,.10); --line-strong:rgba(16,24,40,.18);
  --green:#0E9F5F; --green-wash:rgba(18,183,106,.12);
  --amber:#B45309; --amber-wash:rgba(245,158,11,.14);
  --red:#C8373C; --red-wash:rgba(229,72,77,.12);
  --blue:#2563EB; --blue-wash:rgba(59,130,246,.12);
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px -14px rgba(16,24,40,.22);
  --t:.18s cubic-bezier(.22,1,.36,1);
}
:root[data-theme="dark"]{
  --bg:#070B16; --paper:#0F1626; --paper-2:#131C31;
  --text:#EEF2FA; --text-2:#A9B3C7; --text-3:#6F7A91;
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.18);
  --gold-ink:#E7C66D; --gold-wash:rgba(217,178,76,.16);
  --green:#3DD68C; --amber:#F5B454; --red:#FF7A7F; --blue:#7AA7FF;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
button,input,select{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400;}
.hidden{display:none !important;}

/* ---------- sign-in ---------- */
#signIn{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:var(--navy);
  background-image:radial-gradient(900px 500px at 15% -10%, rgba(217,178,76,.18), transparent 60%);}
.signin-card{width:100%;max-width:380px;background:var(--paper);border-radius:18px;padding:2rem 1.75rem;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);}
.signin-card .logo{width:52px;height:52px;border-radius:50%;box-shadow:0 0 0 3px var(--gold-wash);}
.signin-card h1{font-size:1.75rem;line-height:1.2;margin:1rem 0 .35rem;}
.signin-card p.lead{color:var(--text-2);font-size:.9rem;line-height:1.5;margin-bottom:1.4rem;}
.field{margin-bottom:.9rem;}
.field label{display:block;font-size:.8rem;font-weight:600;margin-bottom:.35rem;color:var(--text-2);}
.input{width:100%;border:1px solid var(--line-strong);background:var(--paper);border-radius:var(--radius-sm);padding:.7rem .85rem;font-size:.92rem;transition:border-color var(--t);}
.input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-wash);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1px solid transparent;border-radius:var(--radius-sm);padding:.62rem 1rem;font-size:.86rem;font-weight:600;transition:background var(--t),border-color var(--t),opacity var(--t);white-space:nowrap;text-decoration:none;}
.btn-primary{background:var(--navy);color:#fff;}
:root[data-theme="dark"] .btn-primary{background:var(--gold);color:var(--navy);}
.btn-primary:hover{opacity:.9;}
.btn-line{background:var(--paper);border-color:var(--line-strong);color:var(--text);}
.btn-line:hover{border-color:var(--gold);}
.btn[disabled]{opacity:.55;pointer-events:none;}
.btn-block{width:100%;padding:.75rem 1rem;}
.msg{font-size:.84rem;margin-top:.9rem;line-height:1.45;}
.msg.err{color:var(--red);}

/* ---------- app ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px);}
.topbar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:.8rem;padding:.7rem 1.25rem;}
.topbar .logo{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px rgba(217,178,76,.5);}
.topbar .title{font-size:1.15rem;line-height:1.1;}
.topbar .sub{font-size:.72rem;color:rgba(255,255,255,.6);}
.topbar .spacer{flex:1;}
.topbar .who{font-size:.8rem;color:rgba(255,255,255,.75);}
.topbar .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.22);color:#fff;padding:.45rem .8rem;}
.topbar .btn-ghost:hover{border-color:var(--gold);}
main{max-width:1280px;margin:0 auto;padding:1.6rem 1.25rem 3rem;}

/* The one bold element: the collection figure, set in the brand serif. */
.summary{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.4rem 2.2rem;margin-bottom:1.4rem;}
.summary .collected{font-size:clamp(2.4rem,6vw,3.6rem);line-height:1;letter-spacing:-.01em;}
.summary .collected-note{color:var(--text-2);font-size:.9rem;margin-top:.45rem;}
.summary .facts{display:flex;gap:1.6rem;flex-wrap:wrap;padding-bottom:.35rem;}
.fact b{display:block;font-size:1.2rem;font-weight:700;}
.fact span{font-size:.78rem;color:var(--text-2);}

.controls{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1rem;}
.controls .search{position:relative;flex:1;min-width:220px;max-width:420px;}
.controls .search i{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:.85rem;}
.controls .search .input{padding-left:2.2rem;}
.controls select.input{width:auto;padding-right:2rem;}
.controls .push{margin-left:auto;}
.custom-range{display:flex;gap:.4rem;align-items:center;font-size:.8rem;color:var(--text-2);}
.custom-range .input{width:auto;padding:.5rem .6rem;}

.tabs{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem;margin-bottom:1rem;scrollbar-width:thin;}
.tab{flex-shrink:0;display:flex;align-items:center;gap:.5rem;border:1px solid var(--line-strong);background:var(--paper);border-radius:999px;padding:.5rem .9rem;font-size:.84rem;font-weight:600;color:var(--text-2);transition:border-color var(--t),background var(--t),color var(--t);}
.tab .n{min-width:1.6rem;text-align:center;border-radius:999px;padding:.08rem .45rem;font-size:.74rem;background:var(--paper-2);color:var(--text-2);}
.tab:hover{border-color:var(--gold);}
.tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff;}
.tab[aria-selected="true"] .n{background:var(--gold);color:var(--navy);}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:var(--navy);}
:root[data-theme="dark"] .tab[aria-selected="true"] .n{background:var(--navy);color:var(--gold);}
.tab-note{font-size:.86rem;color:var(--text-2);line-height:1.5;margin:-.3rem 0 1rem;max-width:75ch;}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:.85rem;}
th{text-align:left;font-size:.76rem;font-weight:600;color:var(--text-2);padding:.75rem .9rem;border-bottom:1px solid var(--line);background:var(--paper-2);white-space:nowrap;}
td{padding:.8rem .9rem;border-bottom:1px solid var(--line);vertical-align:top;}
tbody tr{cursor:pointer;transition:background var(--t);}
tbody tr:hover{background:var(--paper-2);}
tbody tr:last-child td{border-bottom:none;}
.name{font-weight:600;}
.muted{color:var(--text-2);font-size:.78rem;margin-top:.15rem;}
.amount{font-weight:700;white-space:nowrap;}
.when{white-space:nowrap;}
.badge{display:inline-block;border-radius:999px;padding:.18rem .6rem;font-size:.74rem;font-weight:600;white-space:nowrap;}
.b-green{background:var(--green-wash);color:var(--green);}
.b-amber{background:var(--amber-wash);color:var(--amber);}
.b-red{background:var(--red-wash);color:var(--red);}
.b-blue{background:var(--blue-wash);color:var(--blue);}
.b-gold{background:var(--gold-wash);color:var(--gold-ink);}
.actions{display:flex;gap:.35rem;}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid var(--line-strong);background:var(--paper);color:var(--text-2);text-decoration:none;transition:border-color var(--t),color var(--t);}
.icon-btn:hover{border-color:var(--gold);color:var(--text);}
.icon-btn.wa:hover{border-color:#25D366;color:#128C4A;}
.empty{padding:3rem 1.5rem;text-align:center;color:var(--text-2);}
.empty h3{font-size:1.05rem;color:var(--text);margin-bottom:.35rem;}
.loading{padding:2.5rem;text-align:center;color:var(--text-2);}

/* detail drawer */
.overlay{position:fixed;inset:0;background:rgba(5,7,14,.5);z-index:40;display:flex;justify-content:flex-end;}
.drawer{width:min(460px,100%);height:100%;background:var(--paper);overflow-y:auto;padding:1.5rem 1.4rem calc(1.5rem + env(safe-area-inset-bottom,0px));
  box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);animation:slideIn .22s cubic-bezier(.22,1,.36,1);}
@keyframes slideIn{from{transform:translateX(24px);opacity:.4;}to{transform:none;opacity:1;}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none;}}
.drawer-head{display:flex;align-items:flex-start;gap:.8rem;margin-bottom:1.1rem;}
.drawer-head h2{font-size:1.6rem;line-height:1.15;flex:1;}
.drawer-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.3rem;}
.dl{display:grid;grid-template-columns:9.5rem 1fr;gap:.55rem .9rem;font-size:.86rem;margin-bottom:1.4rem;}
.dl dt{color:var(--text-2);}
.dl dd{word-break:break-word;}
.drawer h3{font-size:.95rem;margin:0 0 .6rem;}
.attempt{border-left:2px solid var(--line-strong);padding:.1rem 0 .8rem .9rem;font-size:.84rem;}
.attempt.ok{border-left-color:var(--green);}
.attempt.bad{border-left-color:var(--red);}

.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:.7rem 1rem;border-radius:10px;font-size:.85rem;z-index:60;box-shadow:var(--shadow);}

/* phones: rows become stacked entries */
@media (max-width:760px){
  .topbar .who{display:none;}
  main{padding:1.2rem .9rem 2.5rem;}
  thead{display:none;}
  table,tbody,tr,td{display:block;width:100%;}
  tbody tr{padding:.85rem .9rem;border-bottom:1px solid var(--line);}
  td{border:none;padding:.15rem 0;}
  td[data-k="actions"]{padding-top:.5rem;}
  td[data-label]{display:grid;grid-template-columns:5.5rem 1fr;column-gap:.5rem;}
  td[data-label]::before{content:attr(data-label);grid-row:1 / span 2;color:var(--text-3);font-size:.76rem;font-weight:500;padding-top:.1rem;}
  td[data-label] .muted{grid-column:2;margin-top:0;}
  .controls .push{margin-left:0;}
  .dl{grid-template-columns:1fr;gap:.1rem;}
  .dl dt{margin-top:.5rem;}
}
</style>
</head>
